<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Components - FOUC Prevention Example</title>
  
  <!-- Critical: Preload fonts before any CSS or JS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Preload Material Symbols font file -->
  <link rel="preload" as="font" type="font/woff2" 
        href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v168/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2" 
        crossorigin>
  
  <!-- Load fonts with display=swap to prevent invisible text -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" 
        rel="stylesheet">
  
  <!-- Critical CSS inlined to prevent render blocking -->
  <style>
    /* Immediate FOUC prevention - show loading state */
    html {
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Hide Material Icons until font loads */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', 'Segoe UI Symbol', sans-serif;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      display: inline-block;
      min-width: 1em;
      min-height: 1em;
      text-align: center;
    }
    
    /* Show icons when fonts are loaded */
    html.fonts-loaded .material-symbols-outlined {
      opacity: 1;
    }
    
    /* Fallback when fonts fail */
    html.fonts-failed .material-symbols-outlined {
      opacity: 1;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 2px;
    }
    
    /* Loading spinner */
    .loading-spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #0070d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    html.fonts-loaded .loading-spinner {
      display: none;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Skeleton loader for components */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Spectrum Components FOUC Prevention</h1>
    
    <!-- Example of components with proper loading states -->
    <spectrum-button>
      <span class="loading-spinner"></span>
      <span class="material-symbols-outlined">home</span>
      Home
    </spectrum-button>
    
    <spectrum-button variant="primary">
      <span class="loading-spinner"></span>
      <span class="material-symbols-outlined">search</span>
      Search
    </spectrum-button>
    
    <spectrum-button variant="secondary">
      <span class="loading-spinner"></span>
      <span class="material-symbols-outlined">settings</span>
      Settings
    </spectrum-button>
    
    <!-- Components that depend on fonts -->
    <spectrum-menu>
      <spectrum-menu-item>
        <span class="loading-spinner"></span>
        <span class="material-symbols-outlined">dashboard</span>
        Dashboard
      </spectrum-menu-item>
      <spectrum-menu-item>
        <span class="loading-spinner"></span>
        <span class="material-symbols-outlined">person</span>
        Profile
      </spectrum-menu-item>
    </spectrum-menu>
  </div>

  <!-- Load Spectrum components -->
  <script type="module">
    import { FontLoader } from './font-loading.js';
    
    // Initialize font loading before components load
    FontLoader.initialize({
      timeout: 3000,
      fallbackFonts: ['Segoe UI Symbol', 'Noto Color Emoji', 'Arial', 'sans-serif']
    }).then(() => {
      console.log('Fonts loaded successfully');
    }).catch((error) => {
      console.warn('Font loading failed:', error);
    });
    
    // Listen for font loading events
    document.addEventListener('fontsloaded', () => {
      console.log('Material Symbols font loaded');
    });
    
    document.addEventListener('fontsfailed', () => {
      console.warn('Material Symbols font failed to load, using fallbacks');
    });
    
    // Load Spectrum components after font loading starts
    import('./spectrum-components.js');
  </script>
  
  <!-- Fallback script for browsers without module support -->
  <script nomodule>
    // Basic fallback for older browsers
    document.documentElement.classList.add('fonts-failed');
  </script>
</body>
</html>
